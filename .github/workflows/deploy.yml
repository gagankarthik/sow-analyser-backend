name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployment stage"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

env:
  TF_VERSION:     "1.9.0"
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    name: Build & Deploy (${{ github.event.inputs.stage || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage || 'dev' }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      STAGE:      ${{ github.event.inputs.stage || 'dev' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── AWS credentials ─────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Python + build shared Lambda layer ──────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Gate the deploy on the unit + security regression suite (offline: every
      # AWS / OpenAI call is faked, so this needs no credentials).
      - name: Run tests
        env:
          # Shadow the real deploy credentials for this step, so a test that
          # forgot to fake a client can never touch the live account.
          AWS_ACCESS_KEY_ID:     testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN:     testing
        run: |
          python -m pip install --quiet -r tests/requirements.txt
          python -m pytest tests -q

      - name: Build shared Lambda layer
        run: |
          chmod +x build.sh
          ./build.sh

      # ── Bootstrap Terraform state bucket (idempotent) ───────────────────────
      # Creates an S3 bucket to store tfstate so it persists across CI runs.
      # Without this every run starts with empty state and conflicts on existing
      # resources.
      - name: Bootstrap Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="blue-iq-sow-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV

          # create-bucket fails silently if it already exists (|| true)
          aws s3api create-bucket \
            --bucket "${STATE_BUCKET}" \
            --region "${AWS_REGION}" \
            --create-bucket-configuration LocationConstraint="${AWS_REGION}" 2>/dev/null || true

          aws s3api put-bucket-versioning \
            --bucket "${STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          aws s3api put-public-access-block \
            --bucket "${STATE_BUCKET}" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      # ── Terraform ───────────────────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STAGE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        env:
          # The OpenAI key is NOT passed to Terraform (it would land in state):
          # it is written to Secrets Manager by the step after apply.
          TF_VAR_chat_model:     ${{ secrets.CHAT_MODEL }}
          TF_VAR_aws_region:     ${{ secrets.AWS_REGION }}
          TF_VAR_stage:          ${{ github.event.inputs.stage || 'dev' }}
          TF_VAR_project_name:   blue-iq-sow
          TF_VAR_ai_provider:    ${{ vars.AI_PROVIDER || 'openai' }}
          TF_VAR_notify_from_email: ${{ vars.NOTIFY_FROM_EMAIL }}
          # Sandbox only; Terraform ignores it outside the dev stage too.
          TF_VAR_govern_open_admin: ${{ (github.event.inputs.stage || 'dev') == 'dev' }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        env:
          # The OpenAI key is NOT passed to Terraform (it would land in state):
          # it is written to Secrets Manager by the step after apply.
          TF_VAR_chat_model:     ${{ secrets.CHAT_MODEL }}
          TF_VAR_aws_region:     ${{ secrets.AWS_REGION }}
          TF_VAR_stage:          ${{ github.event.inputs.stage || 'dev' }}
          TF_VAR_project_name:   blue-iq-sow
          TF_VAR_ai_provider:    ${{ vars.AI_PROVIDER || 'openai' }}
          TF_VAR_notify_from_email: ${{ vars.NOTIFY_FROM_EMAIL }}
          # Sandbox only; Terraform ignores it outside the dev stage too.
          TF_VAR_govern_open_admin: ${{ (github.event.inputs.stage || 'dev') == 'dev' }}
        run: terraform apply -auto-approve tfplan

      # Write the OpenAI key into its Secrets Manager secret (out of Terraform
      # state). Skipped when the GitHub secret is not set, e.g. the key is
      # managed in the AWS console instead.
      - name: Store the OpenAI key in Secrets Manager
        working-directory: terraform
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY}" ]; then
            aws secretsmanager put-secret-value \
              --secret-id "$(terraform output -raw openai_secret_arn)" \
              --secret-string "${OPENAI_API_KEY}" > /dev/null
            echo "OpenAI key stored in Secrets Manager."
          else
            echo "OPENAI_API_KEY GitHub secret not set; leaving the Secrets Manager value as is."
          fi

      - name: Print API URL
        working-directory: terraform
        env:
          # The OpenAI key is NOT passed to Terraform (it would land in state):
          # it is written to Secrets Manager by the step after apply.
          TF_VAR_chat_model:     ${{ secrets.CHAT_MODEL }}
          TF_VAR_aws_region:     ${{ secrets.AWS_REGION }}
          TF_VAR_stage:          ${{ github.event.inputs.stage || 'dev' }}
          TF_VAR_project_name:   blue-iq-sow
          TF_VAR_ai_provider:    ${{ vars.AI_PROVIDER || 'openai' }}
          TF_VAR_notify_from_email: ${{ vars.NOTIFY_FROM_EMAIL }}
          # Sandbox only; Terraform ignores it outside the dev stage too.
          TF_VAR_govern_open_admin: ${{ (github.event.inputs.stage || 'dev') == 'dev' }}
        run: |
          echo "Documents API: $(terraform output -raw documents_api_url)"
          echo "DocuSign Connect URL: $(terraform output -raw docusign_webhook_url)"
          echo "Govern tables: $(terraform output -json govern_table_names)"
